{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | ReqClub</title>
    <link rel="stylesheet" href="{% static 'css/user_profile/profile.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen font-sans pb-12">

    <!-- STICKY TOP NAVBAR -->
    <header class="bg-white sticky top-0 z-30 shadow-sm border-b border-slate-200">
        <div class="max-w-4xl mx-auto px-4 sm:px-6">
            <nav class="flex items-center justify-between py-3.5">
                <!-- Brand / Logo -->
                <a href="{% url 'home:home' %}" class="flex items-center gap-2 text-xl font-extrabold tracking-tight text-slate-900 no-underline">
                    <span class="w-8 h-8 rounded-xl bg-[#FBBF24] flex items-center justify-center text-white text-sm shadow-sm">
                        <i class="fa-solid fa-person-running"></i>
                    </span>
                    <span>Req<span class="text-[#FBBF24]">Club</span></span>
                </a>

                <!-- Back to Dashboard Link -->
                <a href="{% url 'home:home' %}" class="flex items-center gap-2 text-xs sm:text-sm font-bold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 px-3.5 py-2 rounded-xl transition no-underline">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to Dashboard</span>
                </a>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="max-w-xl mx-auto px-4 sm:px-6 mt-8">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 sm:p-8">
            
            <div class="flex items-center gap-3 border-b border-slate-100 pb-5 mb-6">
                <div class="w-10 h-10 rounded-xl bg-amber-50 text-[#FBBF24] border border-amber-200/60 flex items-center justify-center text-lg font-bold">
                    <i class="fa-solid fa-user-pen"></i>
                </div>
                <div>
                    <h2 class="text-xl font-extrabold text-slate-900">Edit Profile</h2>
                    <p class="text-xs text-slate-500 font-medium">Update your public runner profile details</p>
                </div>
            </div>
            
            <form method="post" enctype="multipart/form-data" class="space-y-5">
             
                
                <!-- Full Name -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Full Name</label>
                    <input type="text" name="full_name" value="{{ profile.full_name }}"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#FBBF24] focus:border-transparent transition bg-slate-50/50">
                </div>
                
                <!-- Bio -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Bio</label>
                    <textarea name="bio" rows="4"
                              class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#FBBF24] focus:border-transparent transition bg-slate-50/50 resize-none">{{ profile.bio }}</textarea>
                </div>
                
                <!-- Profile Image -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Profile Image</label>
                    {% if profile.profile_image %}
                        <div class="text-xs text-slate-500 bg-slate-50 px-3 py-2 rounded-lg border border-slate-200/60 truncate">
                            <span class="font-semibold text-slate-700">Current:</span> {{ profile.profile_image.name }}
                        </div>
                    {% endif %}
                    <input type="file" name="profile_image" accept="image/*"
                           class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-50 file:text-amber-800 hover:file:bg-amber-100 transition cursor-pointer pt-1">
                </div>
                
                <!-- Save Button -->
                <div class="pt-3">
                    <button type="submit" class="w-full py-3 px-4 rounded-xl text-sm font-bold bg-[#FBBF24] text-slate-900 hover:bg-[#e0a81e] shadow-sm hover:shadow transition">
                        Save Profile
                    </button>
                </div>
            </form>

        </div>
    </main>

</body>
</html>
