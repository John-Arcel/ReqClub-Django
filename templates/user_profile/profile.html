{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | ReRun</title>
    <link rel="stylesheet" href="{% static 'css/user_profile/profile.css' %}">
</head>
<body>
    <nav>
        <div class="nav-brand"><a href="{% url 'home:home' %}" style="text-decoration: none; color: inherit;">ReqClub</a></div>
        <a href="{% url 'home:home' %}" class="back-link">Back to Dashboard</a>
    </nav>
    
    <div class="container">
        <div class="settings-card">
            <h2>Edit Profile</h2>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="full_name" value="{{ profile.full_name }}">
                </div>
                
                <div class="form-group">
                    <label>Bio</label>
                    <textarea name="bio" rows="4">{{ profile.bio }}</textarea>
                </div>
                
                <div class="form-group">
                    <label>Profile Image</label>
                    {% if profile.profile_image %}
                        <p class="current-img">Current: {{ profile.profile_image.name }}</p>
                    {% endif %}
                    <input type="file" name="profile_image" accept="image/*">
                </div>
                
                <button type="submit" class="save-btn">Save Profile</button>
            </form>
        </div>
    </div>
</body>
</html>
